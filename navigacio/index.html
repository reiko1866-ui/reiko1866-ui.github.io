<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#1a73e8"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Navigáció 4D</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.5.0/dist/maplibre-gl.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <div class="letterbox letterbox-top" aria-hidden="true"></div>
    <div class="letterbox letterbox-bottom" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>
    <div id="map" role="application" aria-label="3D térkép"></div>
    <canvas id="fxCanvas" class="fx-canvas" hidden></canvas>

    <p class="mood-chip" id="moodChip">Nappali menet</p>
    <p class="mission" id="missionTitle" hidden></p>
    <p class="flavor" id="flavorLine" hidden></p>

    <section class="maneuver-banner" id="maneuverBanner" hidden>
      <div class="maneuver-icon" id="maneuverIcon" aria-hidden="true">↑</div>
      <div class="maneuver-text">
        <p class="maneuver-distance" id="maneuverDistance">—</p>
        <p class="maneuver-instruction" id="maneuverInstruction">Útvonal keresése…</p>
        <p class="maneuver-street" id="maneuverStreet"></p>
      </div>
    </section>

    <section class="lane-assist" id="laneAssist" hidden>
      <p class="lane-label">Sávasszisztens</p>
      <div class="lane-row" id="laneRow"></div>
      <p class="lane-hint" id="laneHint"></p>
    </section>

    <div class="speed-badge" id="speedBadge" hidden>
      <span class="speed-value" id="speedValue">0</span>
      <span class="speed-unit">km/h</span>
    </div>

    <div class="top-actions">
      <div class="view-switch" role="radiogroup" aria-label="Nézet">
        <label><input type="radio" name="viewMode" value="2d"/><span>2D</span></label>
        <label><input type="radio" name="viewMode" value="3d"/><span>3D</span></label>
        <label><input type="radio" name="viewMode" value="4d" checked/><span>4D</span></label>
      </div>
      <button type="button" class="icon-btn" id="streetBtn" aria-pressed="false" title="Street View">🛣️</button>
      <button type="button" class="icon-btn is-on" id="satBtn" aria-pressed="true" title="Műhold">🛰️</button>
      <button type="button" class="icon-btn" id="cinemaBtn" aria-pressed="false" title="Mozi mód">🎬</button>
      <button type="button" class="icon-btn is-on" id="voiceBtn" aria-pressed="true" title="Bemondó hang">🔊</button>
      <button type="button" class="icon-btn" id="themeToggle" aria-pressed="false" title="Sötét mód">
        <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
        <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
        <span class="visually-hidden">Világos / sötét téma</span>
      </button>
    </div>

    <div class="junction-view" id="junctionPane" hidden>
      <canvas id="junctionCanvas" aria-label="3D sávnézet"></canvas>
    </div>

    <div class="street-view" id="streetViewPane" hidden>
      <div class="street-view-bar">
        <span>Street View — követi az utcát</span>
        <button type="button" id="streetRefresh" class="street-refresh">Frissítés</button>
        <a id="streetViewOpen" href="https://www.google.com/maps" target="_blank" rel="noopener">Megnyitás</a>
      </div>
      <div class="street-stage">
        <iframe id="streetViewFrame" class="is-front" title="Google Street View" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <iframe id="streetViewFrameB" title="Google Street View következő" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div id="streetViewJs" hidden></div>
      </div>
    </div>

    <button type="button" class="fab fab-follow is-active" id="followBtn" aria-pressed="true" title="Követés">
      ⌖
      <span class="visually-hidden">Pozíció követése</span>
    </button>

    <aside class="sidebar" id="sidebar" aria-label="Navigációs panel">
      <button type="button" class="sheet-handle" id="sheetHandle" aria-expanded="false" aria-controls="sidebar">
        <span class="sheet-handle-bar" aria-hidden="true"></span>
        <span class="visually-hidden">Panel kinyitása vagy becsukása</span>
      </button>

      <div class="eta-bar" id="etaBar" hidden>
        <div>
          <span class="eta-value" id="etaClock">—</span>
          <span class="eta-label">érkezés</span>
        </div>
        <div>
          <span class="eta-value" id="routeDuration">—</span>
          <span class="eta-label">idő</span>
        </div>
        <div>
          <span class="eta-value" id="routeDistance">—</span>
          <span class="eta-label">táv</span>
        </div>
      </div>
      <div class="progress-track" id="progressTrack" hidden>
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <form class="search-form" id="searchForm" autocomplete="off">
        <label class="field-label" for="addressInput">Hova?</label>
        <div class="search-row">
          <input
            id="addressInput"
            name="address"
            type="search"
            inputmode="search"
            placeholder="Cím vagy hely keresése"
            enterkeyhint="search"
          />
          <button type="submit" class="btn-primary" id="searchBtn">Keresés</button>
        </div>
        <ul class="search-results" id="searchResults" hidden></ul>
      </form>

      <fieldset class="mode-fieldset">
        <legend>Közlekedési mód</legend>
        <div class="mode-switch" role="radiogroup" aria-label="Közlekedési mód">
          <label class="mode-option">
            <input type="radio" name="travelMode" value="driving" checked/>
            <span>Autó</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="travelMode" value="biking"/>
            <span>Kerékpár</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="travelMode" value="foot"/>
            <span>Gyalogos</span>
          </label>
        </div>
      </fieldset>

      <div class="nav-options">
        <label class="check"><input type="checkbox" id="avoidMotorway"/> Autópálya elkerülése</label>
        <label class="check"><input type="checkbox" id="avoidToll"/> Fizetős utak elkerülése</label>
      </div>

      <p class="route-destination" id="routeDestination" hidden></p>
      <button type="button" class="btn-start" id="startBtn" hidden>Indulhatunk</button>
      <button type="button" class="btn-stop" id="stopBtn" hidden>Navigáció leállítása</button>
      <button type="button" class="btn-preview" id="previewBtn" hidden>4D útvonal-előnézet</button>

      <div class="hazard-box">
        <p class="field-label">Jelzés útközben</p>
        <div class="hazard-row">
          <button type="button" class="hazard-btn" data-hazard="baleset">💥 Baleset</button>
          <button type="button" class="hazard-btn" data-hazard="katyu">🕳️ Kátyú</button>
          <button type="button" class="hazard-btn" data-hazard="dugo">🚗 Dugó</button>
          <button type="button" class="hazard-btn" data-hazard="veszely">⚠️ Veszély</button>
          <button type="button" class="hazard-btn" data-hazard="rendor">🚓 Rendőr</button>
          <button type="button" class="hazard-btn" data-hazard="traffipax">📷 Traffipax</button>
        </div>
      </div>

      <details class="more-details">
        <summary>Street View kulcs (opcionális)</summary>
        <label class="field-label" for="gmapsKey">Google Maps API kulcs</label>
        <input id="gmapsKey" type="password" autocomplete="off" placeholder="Simább 4D Street View-hoz"/>
      </details>
      <p class="status" id="statusText">GPS indítása…</p>
    </aside>

    <footer class="drive-bar" id="driveBar" hidden>
      <div class="drive-speed">
        <span id="driveSpeed">0</span>
        <small>km/h</small>
      </div>
      <p class="drive-road" id="driveRoad">—</p>
      <div class="drive-eta">
        <span id="driveEta">—</span>
        <small>érkezés</small>
      </div>
    </footer>

    <div id="arrivalOverlay" class="arrival-overlay" hidden>
      <p class="arrival-kicker">Vége a jelenetnek</p>
      <h2 id="arrivalTitle">Megérkeztél</h2>
      <p id="arrivalSub"></p>
      <button type="button" id="arrivalOk" class="btn-primary">Új küldetés</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.5.0/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
