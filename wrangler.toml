# Static site only — no Worker / no backend script.
# Cloudflare Pages reads pages_build_output_dir.
# Cloudflare Workers static assets use [assets] without `main`.
# Do not set `main` or `index.js`: that makes the build look for a backend
# and fail instantly (0s).

name = "divian2026"
compatibility_date = "2026-01-01"
pages_build_output_dir = "./public"

[assets]
directory = "./public"
