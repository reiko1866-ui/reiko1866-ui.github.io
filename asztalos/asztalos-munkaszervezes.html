<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c9a227" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Divian — Asztalos munkaszervezés (felhő)</title>
    <link rel="stylesheet" href="divian-brand.css" />
    <style>
      :root {
        --bg: #0f1419;
        --card: #1a222c;
        --text: #f2f4f7;
        --muted: #8b97a5;
        --gold: #c9a227;
        --ok: #3ecf8e;
        --err: #ff6b6b;
        --warn: #ffb450;
        --border: rgba(255, 255, 255, 0.08);
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
      }
      .wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 1.1rem 1rem calc(2rem + env(safe-area-inset-bottom));
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        color: var(--gold);
      }
      .sub {
        margin: 0.25rem 0 1rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem;
        margin-bottom: 0.85rem;
      }
      label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      input,
      select,
      button {
        font: inherit;
      }
      input[type="password"],
      input[type="search"],
      input[type="date"],
      select {
        width: 100%;
        padding: 0.7rem 0.8rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #121820;
        color: var(--text);
      }
      input.felmeres-date {
        max-width: 12rem;
        width: auto;
        flex: 1 1 10rem;
      }
      .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        border: none;
        border-radius: 10px;
        padding: 0.7rem 1rem;
        background: var(--gold);
        color: #1a1c21;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin: 0.5rem 0 0;
        font-size: 0.88rem;
        color: var(--muted);
      }
      .status.is-ok {
        color: var(--ok);
      }
      .status.is-err {
        color: var(--err);
      }
      .job {
        display: grid;
        gap: 0.55rem;
      }
      .job h3 {
        margin: 0;
        font-size: 1.05rem;
      }
      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .badge {
        display: inline-block;
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 700;
        background: rgba(201, 162, 39, 0.18);
        color: var(--gold);
      }
      .badge.warn {
        background: rgba(255, 180, 80, 0.15);
        color: var(--warn);
      }
      .badge.ok {
        background: rgba(62, 207, 142, 0.15);
        color: var(--ok);
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.85rem;
      }
      .stats {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.85rem;
      }
      .stat {
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .stat strong {
        color: var(--text);
      }
      [hidden] {
        display: none !important;
      }
      a.link {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Asztalos munkaszervezés</h1>
        <p class="sub">Felhő — a Váci szerver nélkül is kioszthatod a munkákat.</p>
      </header>

      <section id="loginCard" class="card">
        <label for="adminPin">Admin PIN (6 jegyű)</label>
        <div class="row">
          <input id="adminPin" type="password" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="••••••" />
          <button type="button" class="btn" id="loginBtn">Belépés</button>
        </div>
        <p id="loginStatus" class="status"></p>
      </section>

      <section id="appPanel" hidden>
        <div class="toolbar">
          <button type="button" class="btn" id="refreshBtn">Frissítés</button>
          <button type="button" class="btn ghost" id="logoutBtn">Kilépés</button>
          <a class="btn ghost" href="asztalos-szereles.html" target="_blank" rel="noopener">Asztalos app</a>
        </div>
        <div class="stats" id="statsBar"></div>
        <div class="card" style="padding: 0.75rem">
          <label for="searchInput">Keresés</label>
          <input id="searchInput" type="search" placeholder="Ügyfél, MRDH, telefon…" />
        </div>
        <div id="jobList"></div>
        <p id="appStatus" class="status"></p>
      </section>
    </div>
    <script src="asztalos-munkaszervezes-app.js?v=20260812felmeres"></script>
  </body>
</html>
